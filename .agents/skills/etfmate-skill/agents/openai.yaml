interface:
  display_name: "ETFMate 账户行动报告"
  short_description: "围绕四只目标ETF生成低频波动、分批建仓和清仓不亏的账户行动报告"
  default_prompt: "使用 $etfmate-skill 分析真实账户：510500低频赚波动，159141赛道低吸，159259成长40%与159263价值60%逐步建仓，优先逐只管理现有持仓并争取盈利退出，账户不追加也不转出资金，目标组合按价格与可用现金逐步承接回款；不采集自选池、不运行独立T网格。按v10区分完整日技术指标与实时价格，日线精度和量额逐日对账；当前退出评估与未来网格路径分开，正文先给本次动作、参考价、候选量和限制，完整双向六项草案折叠。确认价按反弹向上、回落向下取档，理论边界与成交价分开。数量≥100，不设单侧暂停，未设上下限隐藏，不展示公共单位说明和规则折叠区，账户限制只在总览说明，全部监控条件单纳入资金冲突核对。复核decision_review中的策略缺口、数量依据、独立成交情景和委托后续处置，80%只作为新增买入门槛，不编造风险阈值、预算或期限，不把回本约束或AI通过说成收益有效。完成本轮输入指纹绑定的逐只AI复核，冲突未解决不得生成正式报告，通过后生成并分享。"
