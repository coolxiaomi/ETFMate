  default_prompt: "使用 $etfmate-skill 分析真实账户：510500低频赚波动，159141赛道低吸，159259成长40%与159263价值60%逐步建仓，优先逐只管理现有持仓并争取盈利退出，账户不追加也不转出资金，目标组合按价格与可用现金逐步承接回款；不采集自选池、不运行独立T网格，按v7综合MA、BIAS、RSI、布林、量能和超卖修复条件，输出完整双向参数及整单限制，数量≥100，不设单侧暂停，未设仓位上下限隐藏，不展示公共单位说明和规则折叠区，账户限制只在总览说明，逐标的按建仓或持仓管理展示具体条件，信号分歧不单独硬阻断，生成并分享账户行动报告。"
